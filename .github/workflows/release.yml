name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Installer les dépendances Node
        working-directory: desktop
        run: npm ci

      - name: Vérifier les types
        working-directory: desktop
        run: npm run typecheck

      - name: Tester
        working-directory: desktop
        run: npm test

      - name: Compiler
        working-directory: desktop
        run: npm run build

  build-macos:
    name: macOS universel
    needs: test
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances
        working-directory: desktop
        run: npm ci

      - name: Compiler l'application
        working-directory: desktop
        run: npm run build

      - name: Créer le DMG universel
        working-directory: desktop
        run: npx electron-builder --mac --universal --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: desktop/release/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances
        working-directory: desktop
        run: npm ci

      - name: Compiler l'application
        working-directory: desktop
        run: npm run build

      - name: Créer l'installeur Windows
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux x64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances
        working-directory: desktop
        run: npm ci

      - name: Compiler l'application
        working-directory: desktop
        run: npm run build

      - name: Créer l'AppImage
        working-directory: desktop
        run: npx electron-builder --linux --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: desktop/release/*.AppImage
          if-no-files-found: error

  publish:
    name: Publier la release
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./desktop/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION de desktop/package.json."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Générer les sommes de contrôle
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
